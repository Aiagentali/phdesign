<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>سبد خرید — PH Web</title>
<link rel="stylesheet" href="css/main.css?v=14">
<link rel="icon" type="image/png" href="assets/favicon180.png?v=2">
<style>
.cart-layout{max-width:900px;margin:0 auto;padding:110px 16px 40px}
.cart-item{background:var(--bg-elev);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.cart-item h3{margin:0 0 8px;font-size:1.05rem}
.cart-paybox{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:12px}
.pay-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.pay-opt{border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;text-align:center;transition:.2s}
.pay-opt.on{border-color:#C8956C;background:color-mix(in srgb,#C8956C 8%,var(--bg-elev))}
.pay-opt b{display:block;font-size:1rem}
.pay-opt small{color:var(--text-mute);font-size:.8rem}
.cart-summary{position:sticky;bottom:0;background:var(--bg-elev);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
@media(max-width:600px){.pay-opts{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="nav"><div class="nav-inner"><a href="index.html" class="logo"><img src="assets/logo.png?v=2" alt="webPH" class="logo-mark"><span class="logo-word" dir="ltr"><span class="lw-web">web</span><span class="lw-ph">PH</span></span></a><div class="nav-links"><a href="shop.html">فروشگاه</a><a href="cart.html" class="active">سبد خرید <span id="cartBadge" style="background:#C8956C;color:#07070A;border-radius:10px;padding:1px 7px;font-size:.75rem;display:none"></span></a><a href="panel.html">پنل من</a></div><div class="nav-actions"><div class="nav-auth" id="navAuth"></div><div class="theme-toggle" id="themeToggle"></div></div></div></nav>

<div class="cart-layout">
  <h1 style="margin:0 0 6px">🛒 سبد خرید</h1>
  <p style="color:var(--text-mute);margin:0 0 18px">سفارش را بررسی کنید و بیعانه یا کل مبلغ را پرداخت کنید</p>
  <div id="cartList"><p>در حال بارگذاری...</p></div>
  <div id="cartSummary" class="cart-summary" style="display:none">
    <div><b id="sumTotal">—</b><br><small id="sumNote" style="color:var(--text-mute)"></small></div>
    <button class="btn btn-primary" id="goPanel" style="display:none" onclick="location.href='panel.html'">مشاهده در پنل →</button>
  </div>
</div>

<script src="js/main.js?v=6"></script>
<script>
const token=localStorage.getItem('token');
if(!token){ location.href='shop.html'; throw new Error('no token'); }
const headers={Authorization:'Bearer '+token,'Content-Type':'application/json'};
const fa=n=>n.toLocaleString('fa-IR');
let terms={deposit_percent:50,allow_deposit:true,allow_full:true,deposit_label:'بیعانه برای شروع پروژه',remaining_label:'تسویه پس از تحویل'};
let orders=[];
let selectedPhase={}; // orderId -> 'deposit'|'remaining'|'full'
let selectedMethod={}; // orderId -> 'crypto'|'card'

async function api(p,o={}){ const r=await fetch(p,{...o,headers:{...headers,...(o.headers||{})}}); const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||'خطا'); return j; }

let payInfo={};
async function load(){
  const s=await fetch('/api/settings').then(r=>r.json()).catch(()=>({}));
  if(s.payment_terms) terms=s.payment_terms;
  payInfo=s.payment_info||{};
  const j=await api('/api/orders');
  orders=(j.orders||[]).filter(o=>o.status==='cart' || o.status==='pending');
  // also include reviewing orders that still have remaining unpaid for second payment
  const reviewingWithRemaining=(j.orders||[]).filter(o=> o.status==='reviewing' && o.remaining>0);
  orders=[...orders, ...reviewingWithRemaining];
  render();
}
function render(){
  const list=document.getElementById('cartList');
  const sumEl=document.getElementById('cartSummary');
  if(!orders.length){
    list.innerHTML='<div class="panel-card" style="text-align:center;padding:32px"><p>سبد خرید شما خالی است</p><a href="shop.html" class="btn btn-primary" style="margin-top:12px">رفتن به فروشگاه →</a></div>';
    sumEl.style.display='none';
    document.getElementById('cartBadge').style.display='none';
    return;
  }
  document.getElementById('cartBadge').textContent=orders.length;
  document.getElementById('cartBadge').style.display='inline-block';
  const depositPct=terms.deposit_percent;
  list.innerHTML=orders.map(o=>{
    const deposit=Math.round(o.total_price*depositPct/100);
    const remaining=o.total_price-deposit;
    const phase=selectedPhase[o.id]|| (terms.allow_deposit?'deposit':'full');
    const method=selectedMethod[o.id]||'crypto';
    const pays=o.payments||[];
    const verifiedDeposit=pays.some(p=>p.payment_phase==='deposit'&&p.status==='verified');
    const canRemaining=verifiedDeposit || o.status!=='cart';
    // determine available phases
    let opts='';
    if(terms.allow_deposit) opts+=`<div class="pay-opt ${phase==='deposit'?'on':''}" onclick="pickPhase('${o.id}','deposit')"><b>بیعانه ${depositPct}٪</b><small>${fa(deposit)} تومان</small><br><small style="color:#C8956C">${terms.deposit_label}</small></div>`;
    if(terms.allow_full) opts+=`<div class="pay-opt ${phase==='full'?'on':''}" onclick="pickPhase('${o.id}','full')"><b>پرداخت کامل</b><small>${fa(o.total_price)} تومان</small></div>`;
    if(canRemaining && o.remaining>0 && o.remaining!==o.total_price) opts+=`<div class="pay-opt ${phase==='remaining'?'on':''}" onclick="pickPhase('${o.id}','remaining')"><b>تسویه باقیمانده</b><small>${fa(o.remaining)} تومان</small><br><small>${terms.remaining_label}</small></div>`;
    const amount = phase==='deposit'?deposit : phase==='remaining'?o.remaining : o.total_price;
    const alreadyPaidPhase = pays.find(p=>p.payment_phase===phase && p.status!=='rejected');
    const progress = o.pay_progress||0;
    return `<div class="cart-item">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
        <h3>${o.type_name} — ${fa(o.total_price)} تومان</h3>
        <span class="badge badge-${o.status==='cart'?'pending':'reviewing'}">${o.status==='cart'?'در سبد':o.status==='pending'?'در انتظار پرداخت':'در حال انجام'}</span>
      </div>
      <small style="color:var(--text-mute)">#${o.id.slice(0,8)} · ${o.days} روز · ${(o.addons||[]).map(a=>a.name).join('، ')||'بدون افزونه'}</small>
      ${o.pay_progress>0?`<div style="margin-top:10px"><div style="height:6px;background:var(--line);border-radius:6px;overflow:hidden"><div style="width:${progress}%;height:100%;background:linear-gradient(90deg,#C8956C,#EDC39A)"></div></div><small style="color:var(--text-mute)">${progress}٪ پرداخت شده — باقیمانده ${fa(o.remaining)} تومان</small></div>`:''}
      <div class="cart-paybox">
        <b>نوع پرداخت</b>
        <div class="pay-opts">${opts}</div>
        <div style="display:flex;gap:8px;margin:8px 0;flex-wrap:wrap">
          <label style="flex:1;min-width:150px;display:flex;align-items:center;gap:6px;padding:10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:${method==='crypto'?'#10b98111':''};border-color:${method==='crypto'?'#10b98144':''}"><input type="radio" name="m-${o.id}" ${method==='crypto'?'checked':''} onchange="pickMethod('${o.id}','crypto')"> ₿ کریپتو (USDT/BTC)</label>
          <label style="flex:1;min-width:150px;display:flex;align-items:center;gap:6px;padding:10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:${method==='card'?'#f59e0b11':''};border-color:${method==='card'?'#f59e0b44':''}"><input type="radio" name="m-${o.id}" ${method==='card'?'checked':''} onchange="pickMethod('${o.id}','card')"> 💳 کارت به کارت</label>
        </div>
        <div style="font-size:.8rem;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;line-height:1.9">
          ${method==='crypto'
            ? `<div style="color:var(--text-mute)">واریز به:</div><div dir="ltr" style="word-break:break-all;font-family:monospace;font-size:.75rem">${payInfo.crypto_addresses?.USDT_TRC20||'—'} <span style="color:var(--text-mute)">(TRC20)</span></div>${payInfo.crypto_addresses?.BTC?`<div dir="ltr" style="word-break:break-all;font-family:monospace;font-size:.75rem;margin-top:4px">${payInfo.crypto_addresses.BTC} <span style="color:var(--text-mute)">(BTC)</span></div>`:''}`
            : `<div style="color:var(--text-mute)">کارت به کارت:</div><div dir="ltr" style="font-weight:800">${payInfo.card_number||'—'}</div><div style="color:var(--text-mute)">به نام ${payInfo.card_holder||'—'}</div>`}
        </div>
        ${alreadyPaidPhase?`<div style="padding:8px;background:${alreadyPaidPhase.status==='verified'?'#10b98122':'#f59e0b22'};border-radius:8px;font-size:.85rem">${alreadyPaidPhase.status==='verified'?'✓ این بخش پرداخت و تایید شد':'⏳ این بخش در انتظار تایید ادمین است'}</div>`:
          `<div id="paybox-${o.id}">
            ${method==='crypto'?`
              <div style="text-align:center;margin-bottom:10px" id="qrwrap-${o.id}"></div>
              <div style="background:var(--bg);border:1px solid rgba(200,149,108,.25);border-radius:12px;padding:12px;margin-bottom:8px;text-align:center">
                <div style="font-size:.75rem;color:var(--text-mute)">دقیقاً این مقدار ارسال کنید (مبلغ یونیکِ سفارش شما)</div>
                <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px" dir="ltr">
                  <b id="camt-${o.id}" style="font-size:1.15rem;color:#EDC39A;font-family:monospace">— USDT</b>
                  <button class="btn-soft" style="padding:4px 10px;font-size:.72rem" onclick="copyAmt('${o.id}')">کپی</button>
                </div>
                <div id="crate-${o.id}" style="font-size:.72rem;color:var(--text-mute);margin-top:4px"></div>
              </div>
              <div style="background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px">
                <div style="font-size:.75rem;color:var(--text-mute)">آدرس واریز (TRC20):</div>
                <div style="display:flex;align-items:center;gap:8px" dir="ltr">
                  <span style="flex:1;word-break:break-all;font-family:monospace;font-size:.72rem" id="caddr-${o.id}">${payInfo.crypto_addresses?.USDT_TRC20||'—'}</span>
                  <button class="btn-soft" style="padding:4px 10px;font-size:.72rem;flex-shrink:0" onclick="copyAddr('${o.id}')">کپی</button>
                </div>
              </div>
              <button class="btn btn-primary" style="width:100%" onclick="startCrypto('${o.id}',${amount})">دریافت آدرس و مبلغ دقیق →</button>
              <div id="cryptostep-${o.id}" style="display:none">
                <p style="font-size:.8rem;color:var(--text-mute);margin:8px 0">بعد از واریز، دکمه زیر را بزنید — خودکار روی بلاکچین چک میشود:</p>
                <button class="btn btn-primary" style="width:100%;background:linear-gradient(135deg,#10b981,#059669)" onclick="checkCrypto('${o.id}')">🔎 بررسی واریز روی بلاکچین</button>
              </div>
            `:`<label style="display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border:1px dashed rgba(200,149,108,.4);border-radius:10px;background:rgba(200,149,108,.05);color:#C8956C;font-size:.85rem;font-weight:700;cursor:pointer;margin-bottom:8px">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              <span id="fn-${o.id}">آپلود عکس فیش واریز</span>
              <input type="file" id="receipt-${o.id}" accept="image/*" style="display:none" onchange="pickFile('${o.id}',this)">
            </label>
            <button class="btn btn-primary" style="width:100%" onclick="doPay('${o.id}',${amount})">ثبت و ارسال فیش</button>`}
            <p id="msg-${o.id}" style="font-size:.82rem;margin-top:8px"></p>
          </div>`}
        <button class="btn btn-ghost" style="width:100%;margin-top:8px;font-size:.82rem" onclick="removeCart('${o.id}')">حذف از سبد</button>
      </div>
    </div>`;
  }).join('');
  // summary
  const totalCart=orders.filter(o=>o.status==='cart').reduce((s,o)=>s+o.total_price,0);
  document.getElementById('sumTotal').textContent='جمع سبد: '+fa(totalCart)+' تومان';
  document.getElementById('sumNote').textContent= totalCart? `بیعانه ${depositPct}٪ = ${fa(Math.round(totalCart*depositPct/100))} تومان برای شروع` : 'سفارشی در سبد نیست';
  sumEl.style.display='flex';
}
window.pickPhase=(id,p)=>{ selectedPhase[id]=p; render(); };
window.pickMethod=(id,m)=>{ selectedMethod[id]=m; render(); };
window.pickFile=(id,input)=>{
  const f=input.files&&input.files[0];
  if(!f) return;
  if(f.size>4*1024*1024){ input.value=''; return alert('حجم فایل حداکثر 4 مگابایت'); }
  const lbl=document.getElementById('fn-'+id);
  lbl.textContent='✓ '+f.name+' ('+(f.size/1024).toFixed(0)+'KB)';
  lbl.parentElement.style.borderColor='#10b98166';
  lbl.parentElement.style.color='#10b981';
};
window.doPay=async(id,amount)=>{
  const phase=selectedPhase[id]|| (terms.allow_deposit?'deposit':'full');
  const method=selectedMethod[id]||'crypto';
  const msg=document.getElementById('msg-'+id);
  let tx_hash='', receipt_url='';
  if(method==='crypto'){ tx_hash=document.getElementById('tx-'+id).value.trim(); if(!tx_hash) return msg.textContent='Tx Hash تراکنش را وارد کنید'; }
  // فیش (عکس) برای هر دو روش الزامی است
  const fileInput=document.getElementById('receipt-'+id);
  const f=fileInput&&fileInput.files&&fileInput.files[0];
  if(!f) return msg.textContent='لطفاً عکس فیش یا اسکرین‌شات تراکنش را آپلود کنید';
  msg.textContent='در حال ارسال...'; msg.style.color='var(--text-mute)';
  const b64=await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.onerror=()=>res(''); r.readAsDataURL(f); });
  if(!b64){ msg.style.color='#ef4444'; return msg.textContent='خطا در خواندن فایل'; }
  msg.textContent='در حال ثبت...';
  try{
    const j=await api('/api/payments',{method:'POST', body:JSON.stringify({order_id:id, method, payment_phase:phase, tx_hash, receipt_data:b64, receipt_name:f.name, receipt_mime:f.type})});
    msg.style.color='#10b981';
    msg.textContent='✓ رسید ارسال شد — منتظر تایید ادمین';
    setTimeout(load,1400);
  }catch(e){ msg.style.color='#ef4444'; msg.textContent=e.message; }
};
window.copyAmt=async(id)=>{ const t=document.getElementById('camt-'+id).textContent.replace(' USDT',''); await navigator.clipboard.writeText(t); toast('مبلغ کپی شد ✓'); };
window.copyAddr=async(id)=>{ const t=document.getElementById('caddr-'+id).textContent; await navigator.clipboard.writeText(t); toast('آدرس کپی شد ✓'); };
function toast(t){ let e=document.getElementById('toast'); if(!e){ e=document.createElement('div'); e.id='toast'; e.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#10b981;color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;z-index:5000;box-shadow:0 8px 24px rgba(0,0,0,.4)'; document.body.appendChild(e);} e.textContent=t; e.style.opacity='1'; setTimeout(()=>e.style.opacity='0',2200); }
let cryptoPay={}; // orderId -> payment_id
window.startCrypto=async(id,amount)=>{
  const phase=selectedPhase[id]||(terms.allow_deposit?'deposit':'full');
  const msg=document.getElementById('msg-'+id);
  msg.textContent='در حال قفل کردن مبلغ...'; msg.style.color='var(--text-mute)';
  try{
    const j=await api('/api/payments',{method:'POST', body:JSON.stringify({order_id:id, method:'crypto', payment_phase:phase})});
    cryptoPay[id]=j.payment.id;
    document.getElementById('camt-'+id).textContent=j.payment.crypto_amount+' USDT';
    document.getElementById('crate-'+id).textContent='نرخ لحظه‌ای: '+fa(j.payment.rate_used)+' تومان — اعتبار ۳۰ دقیقه';
    // QR
    const addr=payInfo.crypto_addresses?.USDT_TRC20||'';
    const qrEl=document.getElementById('qrwrap-'+id);
    qrEl.innerHTML=`<img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&bgcolor=07070A&color=EDC39A&data=${encodeURIComponent('tron:'+addr+'?amount='+j.payment.crypto_amount)}" width="150" height="150" style="border-radius:12px;border:1px solid var(--line)">`;
    document.getElementById('cryptostep-'+id).style.display='block';
    msg.textContent='✓ مبلغ یونیک شما قفل شد — بعد از واریز، بررسی را بزنید';
    msg.style.color='#10b981';
    load(); // refresh badge (status pending)
  }catch(e){ msg.style.color='#ef4444'; msg.textContent=e.message; }
};
window.checkCrypto=async(id)=>{
  const msg=document.getElementById('msg-'+id);
  const pid=cryptoPay[id];
  if(!pid) return msg.textContent='اول مبلغ را دریافت کنید';
  msg.textContent='در حال بررسی بلاکچین...'; msg.style.color='var(--text-mute)';
  try{
    const r=await fetch('/api/payments/verify?payment_id='+pid, {headers});
    const j=await r.json();
    if(j.status==='verified'){
      msg.style.color='#10b981';
      msg.textContent='✓✓ واریز روی بلاکچین تایید شد! سفارش شما در حال بررسی وارد شد';
      toast('پرداخت تایید شد 🎉');
      setTimeout(load,1500);
    } else {
      msg.style.color='#f59e0b';
      msg.textContent='⏳ '+(j.message||'هنوز واریزی دیده نشد — ۲-۳ دقیقه صبر کنید و دوباره بزنید');
    }
  }catch(e){ msg.style.color='#ef4444'; msg.textContent=e.message; }
};
window.removeCart=async(id)=>{
  if(!confirm('این سفارش از سبد حذف شود؟')) return;
  try{
    const r=await fetch('/api/cart?id='+encodeURIComponent(id),{method:'DELETE', headers});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||('خطای سرور '+r.status));
    load();
  }catch(e){ alert('حذف نشد: '+e.message); }
};
load();
</script>
</body>
</html>
