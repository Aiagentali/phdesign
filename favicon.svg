<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="wA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9A06B"/>
      <stop offset="1" stop-color="#B5733F"/>
    </linearGradient>
    <linearGradient id="wB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A4E22"/>
      <stop offset="1" stop-color="#6E3B16"/>
    </linearGradient>
  </defs>
  <!-- three-dot bar (browser window) -->
  <rect x="28" y="6" width="44" height="15" rx="5" fill="url(#wA)"/>
  <circle cx="39" cy="13.5" r="2.1" fill="#0B0B0F"/>
  <circle cx="50" cy="13.5" r="2.1" fill="#0B0B0F"/>
  <circle cx="61" cy="13.5" r="2.1" fill="#0B0B0F"/>
  <!-- origami W: faceted zigzag, alternating light/dark folds -->
  <polygon points="14,30 24,30 36,90 26,90" fill="url(#wA)"/>
  <polygon points="24,30 34,30 44,56 36,90" fill="url(#wB)"/>
  <polygon points="36,90 44,56 52,42 56,56 44,90" fill="url(#wA)" transform="translate(0,0)"/>
  <polygon points="44,56 52,42 60,90 52,90" fill="url(#wB)"/>
  <polygon points="52,42 62,30 72,30 60,90" fill="url(#wA)"/>
  <polygon points="72,30 86,30 74,90 64,90" fill="url(#wB)"/>
</svg>